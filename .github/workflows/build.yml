name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Matching version tag to publish; empty means continuous only'
        required: false
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check manifest and select release
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python3 scripts/check-release.py
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["addons"][0]["version"])')
          tag="$RELEASE_TAG"
          if [[ -z "$tag" && "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$tag" && "$tag" != "v$version" ]]; then
            echo "Release tag must match manifest.json: v$version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: aarch64-linux
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates git ninja-build pkg-config \
            python3 python3-venv python3-pil luajit libssl-dev
      - uses: actions/checkout@v7.0.1
      - name: Meson
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install meson
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build and test
        run: |
          python3 scripts/fetch-assets.py
          meson setup build --buildtype=release -Dstrip=true
          meson compile -C build
          meson test -C build --num-processes 1 --print-errorlogs
      - name: Package binaries and corresponding sources
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          args=()
          if [[ "$ARCH" == x86_64-linux ]]; then args+=(--sources); fi
          python3 scripts/package.py build --arch "$ARCH" "${args[@]}"
          if [[ "$ARCH" == x86_64-linux ]]; then
            python3 scripts/fetch-assets.py --bundle dist
          fi
          python3 scripts/check-release.py dist --arch "$ARCH" --odamex
          python3 tests/package-runtime.py "dist/freedoom.$ARCH.tar.gz" "$ARCH"
          if readelf -d "build/freedoom-bridge.$ARCH.so" | grep NEEDED | grep -Ei 'SDL|openal|fluidsynth'; then
            echo 'Engine unexpectedly depends on a private audio/video runtime' >&2
            exit 1
          fi
          if readelf -d build/src/odamex/*.so | grep NEEDED | grep -Ei 'SDL|openal|protobuf|libcurl|libpng|libssl|libcrypto|libz\.so'; then
            echo 'Odamex has an unexpected dynamic dependency' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: freedoom-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64-darwin
          - runner: macos-15-intel
            arch: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build dependencies
        run: |
          brew install meson ninja pkgconf
          python3 -m venv .venv
          .venv/bin/pip install meson Pillow
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build OpenSSL for the deployment target
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version=3.5.9
          archive="openssl-$version.tar.gz"
          prefix="$RUNNER_TEMP/openssl"
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/openssl/openssl/releases/download/openssl-$version/$archive"
          echo "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  $archive" | shasum -a 256 -c -
          tar -xzf "$archive"
          cd "openssl-$version"
          case "$ARCH" in
            aarch64-darwin) target=darwin64-arm64-cc ;;
            x86_64-darwin) target=darwin64-x86_64-cc ;;
            *) exit 1 ;;
          esac
          perl Configure "$target" no-shared no-tests --prefix="$prefix" --libdir=lib \
            "-mmacosx-version-min=$MACOSX_DEPLOYMENT_TARGET"
          make -j "$(sysctl -n hw.ncpu)" build_sw
          make install_sw
          install -m 644 LICENSE.txt "$prefix/LICENSE.txt"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build, test and package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/fetch-assets.py
          meson setup build --buildtype=release -Dstrip=true
          meson compile -C build
          meson test -C build --num-processes 1 --print-errorlogs
          python3 scripts/package.py build --arch "$ARCH"
          python3 scripts/check-release.py dist --arch "$ARCH" --odamex
          python3 tests/package-runtime.py "dist/freedoom.$ARCH.tar.gz" "$ARCH"
          if otool -L build/src/odamex/*.so | grep -E '^[[:space:]]+(/opt/homebrew|/usr/local)'; then
            echo 'Odamex unexpectedly depends on a Homebrew library' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: freedoom-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pillow
      - name: Build, test and package
        run: |
          python scripts/fetch-assets.py
          meson setup build --buildtype=release -Dstrip=true
          meson compile -C build
          meson test -C build --num-processes 1 --print-errorlogs
          python scripts/package.py build --arch x86_64-windows
          python scripts/check-release.py dist --arch x86_64-windows --odamex
          python tests/package-runtime.py dist/freedoom.x86_64-windows.zip x86_64-windows
          # Only Windows system DLLs should be required, not MSYS2's SDL/GCC runtimes.
          if objdump -p build/freedoom-bridge.x86_64-windows.dll build/src/odamex/*.dll | grep 'DLL Name:' | grep -Ei 'SDL|OpenAL|libgcc|libstdc\+\+|libwinpthread|protobuf|libcurl|libpng|zlib'; then
            echo 'Engine has an unexpected private runtime dependency' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: freedoom-x86_64-windows
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, linux, macos, windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: freedoom-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: freedoom-*
          path: artifacts
          merge-multiple: true
      - name: Validate complete release
        run: |
          test -s artifacts/freedoom-sources.tar.gz
          python3 scripts/check-release.py artifacts --checksums artifacts/SHA256SUMS
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS)
          cat > release-notes.md <<EOF
          Freedoom for Pragtical, built from $GITHUB_SHA.

          An independent Pragtical plugin for playing Freedoom and FreeDM.
          It is not affiliated with or endorsed by the Freedoom project.

          PPM installs the Lua plugin from the repository. The platform archive
          contains the Woof and Odamex libraries, their resources in assets/,
          and license notices. PPM separately fetches
          a verified asset bundle with both Freedoom campaigns and FreeDM in iwads/.
          Woof renders at the game view's resolution with interpolated frames.
          The matching engine and bridge sources are included
          in freedoom-sources.tar.gz. LuaJIT is required in Pragtical.
          Audio uses Pragtical's mixer, with native OPL synthesis for music.
          EOF
          publish() {
            local tag="$1" title="$2" prerelease="$3"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "${assets[@]}" --clobber
              gh release edit "$tag" --title "$title" --notes-file release-notes.md --prerelease="$prerelease"
            else
              gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
                --title "$title" --notes-file release-notes.md --prerelease="$prerelease"
            fi
          }
          if [[ -n "$RELEASE_TAG" ]]; then
            publish "$RELEASE_TAG" "$RELEASE_TAG" false
            git push --force origin "$GITHUB_SHA:refs/tags/latest"
            publish latest latest false
          fi
          git push --force origin "$GITHUB_SHA:refs/tags/continuous"
          publish continuous 'Continuous Release' true
